# Nightly encrypted backup of the cloud database (docs/BACKUP_RECOVERY.md).
# Needs two repository secrets: SUPABASE_DB_URL (the Session pooler connection
# string from Supabase) and BACKUP_PASSPHRASE (at least 16 characters). The
# backup is kept here for 90 days as a 7-Zip file that only the passphrase
# opens; download it to the home hard drive from the run's page.
name: Database backup

on:
  schedule:
    # 00:30 in Manila (16:30 UTC), after closing.
    - cron: "30 16 * * *"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    # Stop at the first failing command, including inside pipes.
    shell: bash

concurrency:
  group: db-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
    steps:
      - name: Check the secrets are set
        run: |
          if [ -z "$DB_URL" ] || [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "::error::Add the SUPABASE_DB_URL and BACKUP_PASSPHRASE repository secrets (Settings > Secrets and variables > Actions). See docs/BACKUP_RECOVERY.md."
            exit 1
          fi
          if [ "${#BACKUP_PASSPHRASE}" -lt 16 ]; then
            echo "::error::BACKUP_PASSPHRASE is shorter than 16 characters. Make it longer (for example four unrelated words) and update the secret."
            exit 1
          fi

      - uses: actions/checkout@v5

      - name: Install the PostgreSQL client and 7-Zip
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update -qq
          # pg_dump must be at least the server's version; ask the server which
          # (the runner's own psql is enough for that), else use 17.
          major="$(psql "$DB_URL" -X -At -c "show server_version_num" 2>/dev/null || true)"
          major=$(( ${major:-170000} / 10000 ))
          [ "$major" -ge 17 ] || major=17
          sudo apt-get install -y -qq "postgresql-client-$major" p7zip-full >/dev/null
          echo "/usr/lib/postgresql/$major/bin" >> "$GITHUB_PATH"
          echo "Installed the PostgreSQL $major client."

      - name: Check the database connection
        run: bash scripts/db-check-url.sh

      - name: Back up the database
        id: backup
        run: |
          status=0
          bash scripts/db-backup.sh backup > backup.out 2> backup.err || status=$?
          cat backup.err >&2
          if [ "$status" -ne 0 ]; then
            # Show the failing stage and error in the summary, with project
            # names, hosts and addresses hidden (the log is public).
            why="$(tail -4 backup.err | sed -E 's/[a-z0-9.-]+\.supabase\.(co|com)/<host>/g; s/postgres\.[a-z0-9]+/postgres.<project>/g; s/[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+/<address>/g' | tr '\n' ' ')"
            echo "::error::Backup failed: $why"
            echo "Backup failed: $why" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          grep '^warning:' backup.err | sed 's/^warning: /::warning::/' || true
          file="$(tail -1 backup.out)"
          if [ ! -s "$file" ]; then
            echo "::error::The backup file was not made. See the log of this step."
            exit 1
          fi
          echo "file=$file" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$file" .7z)" >> "$GITHUB_OUTPUT"
          echo "bytes=$(stat -c %s "$file")" >> "$GITHUB_OUTPUT"
          echo "Backup made: $(basename "$file"), $(du -h "$file" | cut -f1)" >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the backup for 90 days
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.backup.outputs.name }}
          path: ${{ steps.backup.outputs.file }}
          retention-days: 90
          compression-level: 0
          if-no-files-found: error

      - name: Record the run for the Back Office
        if: always() && env.DB_URL != ''
        env:
          KIND: ${{ github.event_name == 'schedule' && 'scheduled' || 'manual' }}
          OK: ${{ steps.backup.outcome == 'success' && steps.upload.outcome == 'success' }}
          BYTES: ${{ steps.backup.outputs.bytes }}
          NOTE: "${{ steps.backup.outputs.name || 'backup failed, see the run log on GitHub' }}"
        run: |
          psql "$DB_URL" -X -q -v ON_ERROR_STOP=1 -v kind="$KIND" -v ok="$OK" -v bytes="$BYTES" -v note="$NOTE" <<'SQL' \
            || echo "::warning::Could not record this run in the database (see the connection check above, or run migration 12)."
          insert into backup_runs (kind, ok, bytes, note)
          values (:'kind', :'ok'::boolean, nullif(:'bytes', '')::bigint, left(:'note', 300));
          SQL
